name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump, applied to the latest stable release
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: Release channel
        type: choice
        options: [stable, beta, nightly]
        default: stable

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - name: Check branch
        if: inputs.channel == 'stable' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Stable releases must be cut from main (this run is on $GITHUB_REF_NAME)."
          exit 1

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Releases must be signed with the same key every time, or Android refuses to install updates."
            exit 1
          fi

      - name: Work out version
        id: version
        run: |
          tag=$(scripts/next-version.sh "$BUMP" "$CHANNEL")
          # Run numbers only go up, so each release can be installed over any earlier one.
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (versionCode $code) on the $CHANNEL channel" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MURMUR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          MURMUR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MURMUR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MURMUR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -Pmurmur.versionName=${{ steps.version.outputs.name }}
          -Pmurmur.versionCode=${{ steps.version.outputs.code }}

      - name: Collect APK
        id: apk
        run: |
          apk="murmur-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          flags=(--target "$GITHUB_SHA" --title "Murmur ${TAG#v}" --generate-notes)
          case "$CHANNEL" in
            stable) flags+=(--latest) ;;
            *)      flags+=(--prerelease --latest=false) ;;
          esac
          # Nightly notes cover everything since the last beta or stable release,
          # not just since yesterday's nightly.
          if [ "$CHANNEL" = nightly ]; then
            since=$(git tag --list 'v*' --sort=-creatordate | grep -v -- '-nightly\.' | head -n1 || true)
            if [ -n "$since" ]; then flags+=(--notes-start-tag "$since"); fi
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" "${flags[@]}"

      - name: Prune old nightlies
        if: inputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the 7 most recent nightly releases.
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | contains("-nightly."))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
